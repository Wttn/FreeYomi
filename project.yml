# Projeto Xcode gerado pelo XcodeGen (https://github.com/yonaskolb/XcodeGen, MIT).
# O .xcodeproj NÃO é versionado: gere com `xcodegen generate` (feito pelo CI).
name: FreeYomi
options:
  bundleIdPrefix: io.github.freeyomi
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: pt-BR
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.5.0"
    CURRENT_PROJECT_VERSION: "6"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
packages:
  FreeYomiKit:
    path: Packages/FreeYomiKit
targets:
  FreeYomi:
    type: application
    platform: iOS
    # Liga a JVM embutida quando JVM/build/JVM.xcconfig existe (ver scripts/prepare-jvm.sh).
    configFiles:
      Debug: Config/FreeYomi.xcconfig
      Release: Config/FreeYomi.xcconfig
    sources:
      - App
      - DesignSystem
      - Features
      - path: Resources
        excludes:
          - Info.plist
      # JAVA_HOME e runtime das extensões: no app ficam em FreeYomi.app/lib e /jars
      # (o HotSpot estático do iOS usa <app>/lib como java.home).
      - path: JVM/build/bundle/lib
        type: folder
        buildPhase: resources
        optional: true
      - path: JVM/build/bundle/jars
        type: folder
        buildPhase: resources
        optional: true
    dependencies:
      - package: FreeYomiKit
        product: FreeYomiKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.freeyomi.app
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        INFOPLIST_FILE: Resources/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: App/JVM/FreeYomi-Bridging-Header.h
        # A JVM procura as funções nativas (JNI) no executável principal.
        ENABLE_DEBUG_DYLIB: NO
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: FreeYomi
        CFBundleDevelopmentRegion: pt-BR
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        ITSAppUsesNonExemptEncryption: false
        LSSupportsOpeningDocumentsInPlace: false
        # Links "adicionar repositório" (mesmos formatos do Mihon); sempre pedem confirmação.
        CFBundleURLTypes:
          - CFBundleURLName: io.github.freeyomi.add-repo
            CFBundleURLSchemes:
              - freeyomi
              - tachiyomi
              - mihon
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: O FreeYomi acessa a rede local apenas para se conectar ao servidor de extensões (Suwayomi-Server) que você configurar.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Quadrinho (CBZ)
            LSHandlerRank: Owner
            LSItemContentTypes:
              - io.github.freeyomi.cbz
          - CFBundleTypeName: Arquivo ZIP ou EPUB
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.zip-archive
              - org.idpf.epub-container
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: io.github.freeyomi.cbz
            UTTypeDescription: Comic Book Archive (CBZ)
            UTTypeConformsTo:
              - public.zip-archive
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - cbz
              public.mime-type:
                - application/vnd.comicbook+zip
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  FreeYomiTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/AppTests
        excludes:
          - Fixtures
      # Extensão de teste baixada pelo CI (não versionada).
      - path: Tests/AppTests/Fixtures
        type: folder
        buildPhase: resources
        optional: true
    dependencies:
      - target: FreeYomi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.freeyomi.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/FreeYomi.app/FreeYomi
        BUNDLE_LOADER: $(TEST_HOST)
  FreeYomiUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Tests/UITests
    dependencies:
      - target: FreeYomi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.freeyomi.uitests
        TEST_TARGET_NAME: FreeYomi
        GENERATE_INFOPLIST_FILE: YES
schemes:
  FreeYomi:
    build:
      targets:
        FreeYomi: all
        FreeYomiTests: [test]
        FreeYomiUITests: [test]
    test:
      targets:
        - FreeYomiTests
        - FreeYomiUITests
      gatherCoverageData: true
