# App de teste da JVM embutida (não faz parte do FreeYomi). Gerado pelo CI:
# o JAVA_HOME vai em Resources/lib (no app: JVMProbe.app/lib, onde o HotSpot
# estático do iOS procura), os .jar em Resources/jars e as bibliotecas em jvm/.
name: JVMProbe
options:
  bundleIdPrefix: io.github.freeyomi
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
targets:
  JVMProbe:
    type: application
    platform: iOS
    configFiles:
      Debug: jvm.xcconfig
      Release: jvm.xcconfig
    sources:
      - path: Sources
      - path: Resources/lib
        type: folder
        buildPhase: resources
      - path: Resources/jars
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.freeyomi.jvmprobe
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: YES
        SWIFT_OBJC_BRIDGING_HEADER: Sources/JVMProbe-Bridging-Header.h
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        DEAD_CODE_STRIPPING: NO
        ENABLE_DEBUG_DYLIB: NO
        STRIP_INSTALLED_PRODUCT: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
  JVMProbeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: JVMProbe
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/JVMProbe.app/JVMProbe
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  JVMProbe:
    build:
      targets:
        JVMProbe: all
        JVMProbeTests: [test]
    test:
      targets:
        - JVMProbeTests
