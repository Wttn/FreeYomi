name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Núcleo multiplataforma: roda em Linux (rápido e barato).
  core-linux:
    name: Núcleo (Linux, swift test)
    runs-on: ubuntu-24.04
    container: swift:6.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Dependências de sistema
        run: apt-get update && apt-get install -y --no-install-recommends libsqlite3-dev zlib1g-dev
      - name: Testes
        working-directory: Packages/FreeYomiKit
        shell: bash
        run: |
          status=0
          swift test --parallel > test.log 2>&1 || status=$?
          tail -30 test.log
          # Erros de compilação e falhas viram anotações (visíveis sem baixar o log).
          grep -E "error:" test.log | sort -u | head -30 | sed 's/^/::error::/' || true
          grep -E "XCTAssert|failed \(|Fatal error" test.log | sort -u | head -30 | sed 's/^/::error::/' || true
          exit "$status"

  # App iOS: gera o projeto, compila, roda testes de interface e produz um .ipa sem assinatura.
  ios:
    name: App iOS (Xcode 26)
    runs-on: macos-26
    timeout-minutes: 75
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      # Índice usado SÓ para baixar uma extensão para o teste de integração do CI.
      # Não entra no app: o FreeYomi não vem com repositórios.
      TEST_REPO_INDEX: https://raw.githubusercontent.com/keiyoushi/extensions/repo/index.json
    steps:
      - uses: actions/checkout@v4

      # JDK do runner: certificados, política de criptografia e fusos para a JVM embutida.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # A JVM embutida (OpenJDK Mobile) e o runtime das extensões são compilados pelos
      # workflows jvm-ios.yml e jvm-runtime.yml; aqui usamos o último artefato de cada um.
      # Sem eles, o app compila sem o runtime de extensões Android.
      - name: Baixar a JVM embutida
        continue-on-error: true
        run: |
          mkdir -p JVM/artifacts/jvm JVM/artifacts/runtime
          for wf in jvm-ios.yml:jvm jvm-runtime.yml:runtime; do
            RUN=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "${wf%%:*}" --status success --limit 1 \
                  --json databaseId --jq '.[0].databaseId' || true)
            echo "::notice title=${wf%%:*}::run ${RUN:-nenhum}"
            [ -n "$RUN" ] && gh run download "$RUN" --repo "$GITHUB_REPOSITORY" --dir "JVM/artifacts/${wf##*:}" || true
          done

      - name: Preparar a JVM embutida
        continue-on-error: true
        env:
          JVM_ARTIFACTS: JVM/artifacts/jvm
          RUNTIME_ARTIFACTS: JVM/artifacts/runtime
        run: scripts/prepare-jvm.sh

      - name: Selecionar Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then XCODE=/Applications/Xcode.app; fi
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Gerar projeto
        run: |
          mkdir -p JVM/build/bundle/lib JVM/build/bundle/jars
          xcodegen generate

      - name: Testes do núcleo (macOS)
        working-directory: Packages/FreeYomiKit
        run: swift test

      - name: Escolher simulador
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 scripts/pick_simulator.py)
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Simulador: $UDID"

      - name: Compilar e testar (simulador)
        run: |
          status=0
          xcodebuild test \
            -project FreeYomi.xcodeproj \
            -scheme FreeYomi \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath build/TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO > build-test.log 2>&1 || status=$?
          grep -E "error:|Test Case .*(passed|failed)|\*\* (TEST|BUILD)" build-test.log || true
          grep -E "FYJVM-APP" build-test.log | cut -c1-600 | sed 's/^/::notice title=JVM no app::/' || true
          grep -E "JVMIntegrationTests.*skipped|Test skipped" build-test.log | head -3 | sed 's/^/::warning title=JVM no app::/' || true
          if [ -f "$HOME/fyjvm.log" ]; then grep -v "^\s*$" "$HOME/fyjvm.log" | tail -25 | cut -c1-400 | sed 's/^/::notice title=saída da JVM::/'; cp "$HOME/fyjvm.log" build/ 2>/dev/null || true; fi
          HSERR=$(find ~/Library/Developer/CoreSimulator/Devices -name 'hs_err_pid*.log' 2>/dev/null | head -1)
          if [ -n "$HSERR" ]; then grep -v "^\s*$" "$HSERR" | head -40 | sed 's/^/::warning title=hs_err::/'; cp "$HSERR" build/ || true; fi
          # Erros de compilação e testes que falharam também viram anotações (visíveis sem baixar o log).
          grep -E "error:" build-test.log | sort -u | head -40 | sed 's/^/::error::/' || true
          grep -E "Test Case .*failed|XCTAssert.*failed|: error: -\[" build-test.log | sort -u | head -40 | sed 's/^/::error::/' || true
          if [ "$status" -ne 0 ]; then tail -200 build-test.log; exit "$status"; fi

      - name: Gerar .ipa sem assinatura
        run: |
          set -o pipefail
          xcodebuild archive \
            -project FreeYomi.xcodeproj \
            -scheme FreeYomi \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath build/FreeYomi.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" > build-archive.log 2>&1 \
            || (grep -E "error:" build-archive.log; tail -100 build-archive.log; exit 1)
          mkdir -p build/Payload
          cp -R build/FreeYomi.xcarchive/Products/Applications/FreeYomi.app build/Payload/
          (cd build && zip -qry FreeYomi-unsigned.ipa Payload)
          ls -la build/FreeYomi-unsigned.ipa

      - name: Publicar .ipa
        uses: actions/upload-artifact@v4
        with:
          name: FreeYomi-unsigned-ipa
          path: build/FreeYomi-unsigned.ipa
          retention-days: 30

      - name: Publicar resultados de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            build/TestResults.xcresult
            build/fyjvm.log
            build/hs_err_pid*.log
            build-test.log
            build-archive.log
          retention-days: 14
