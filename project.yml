# Projeto Xcode gerado pelo XcodeGen (https://github.com/yonaskolb/XcodeGen, MIT).
# O .xcodeproj NÃO é versionado: gere com `xcodegen generate` (feito pelo CI).
name: FreeYomi
options:
  bundleIdPrefix: io.github.freeyomi
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: pt-BR
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "2"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
packages:
  FreeYomiKit:
    path: Packages/FreeYomiKit
targets:
  FreeYomi:
    type: application
    platform: iOS
    sources:
      - App
      - DesignSystem
      - Features
      - path: Resources
        excludes:
          - Info.plist
    dependencies:
      - package: FreeYomiKit
        product: FreeYomiKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.freeyomi.app
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        INFOPLIST_FILE: Resources/Info.plist
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: FreeYomi
        CFBundleDevelopmentRegion: pt-BR
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        ITSAppUsesNonExemptEncryption: false
        LSSupportsOpeningDocumentsInPlace: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: Quadrinho (CBZ)
            LSHandlerRank: Owner
            LSItemContentTypes:
              - io.github.freeyomi.cbz
          - CFBundleTypeName: Arquivo ZIP ou EPUB
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.zip-archive
              - org.idpf.epub-container
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: io.github.freeyomi.cbz
            UTTypeDescription: Comic Book Archive (CBZ)
            UTTypeConformsTo:
              - public.zip-archive
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - cbz
              public.mime-type:
                - application/vnd.comicbook+zip
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  FreeYomiUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Tests/UITests
    dependencies:
      - target: FreeYomi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.freeyomi.uitests
        TEST_TARGET_NAME: FreeYomi
        GENERATE_INFOPLIST_FILE: YES
schemes:
  FreeYomi:
    build:
      targets:
        FreeYomi: all
        FreeYomiUITests: [test]
    test:
      targets:
        - FreeYomiUITests
      gatherCoverageData: true
